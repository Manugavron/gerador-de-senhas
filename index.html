<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de senhas</title>
</head>
<style>
    {
 box-sizing:border-box;
margin: 0;
padding: 0;
font-family; 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
body {  
background-color: #d1d5db;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
}
/* Container Principal */
.card {
background:linear-gradient(180deg,#a7a3a8 0%, #bd93d8 100%) ;
width: 100%;
max-width>: 420px;
pagging: 30px 25px;
border-radius: 20px;
box-shadow: 0 10px 25px rgba (0,0,0,0.15);
color: #311b92;
}
.title{
font-size: 1.5rem;
font-weight: 700;
margin-bottom: 20px;
color: #2a105c;
}
/* Campo de exibição da senha */
.output-box {
background-color: #8372cb;
border-radius: 12px;
padding: 15px;
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 25px;
color: #ffffff;
font-weight: 600;
font-size: 1.1rem;
}
.output-box span{
 word-break: break-all;
}
.btn-copy{
background-color: #5c35ad;
color: white;
border: none;
padding: 6px 12px;
border-radius: 8px;
cursor: pointer;
font-size: 0.85rem;
transition: background 0.2s;
}
.btn-copy: hover{}
</style>
<body>
    
</body>
</html>
